[pytest]
testpaths = quality/unit cdc/tests agents/tests experiments/tests
python_files = test_*.py
# The packages under test are imported by module path (cdc.parity, agents.registry), and
# pytest only adds the rootdir to sys.path when it is invoked from the repository root.
# Stating it here makes `pytest` and `python -m pytest` behave the same in CI, where the
# working directory is not guaranteed to be the rootdir.
pythonpath = .
addopts = -q --strict-markers
