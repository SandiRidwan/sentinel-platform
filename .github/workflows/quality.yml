name: quality

# The gate. A pull request that breaks a contract, a model or an expectation is not merged
# because a human noticed; it is blocked because the pipeline said so.
#
# Design notes:
# - Level 2 (spider contracts) and level 4 (expectations) need live sites and a warehouse,
#   so they run on the main branch and on a schedule. On pull requests the fast levels gate
#   the change; the slow ones would make every push wait on someone else's server.
# - Nothing here is allowed to "continue on error". A gate that can be ignored is decoration.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  SENTINEL_LOG_JSON: "1"
  DBT_TARGET: dev

jobs:
  lint-and-unit:
    name: L1 lint + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ruff
        run: ruff check tools ingestion transform quality cdc agents governance bench --output-format=github

      - name: mypy (non-blocking on third-party stubs)
        run: mypy tools --ignore-missing-imports || true

      - name: pytest
        run: pytest quality/unit -q --cov=tools --cov-report=term-missing

  go-fetcher:
    name: L1 go vet + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion/go-fetcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: ingestion/go-fetcher/go.sum

      - run: go vet ./...
      - run: go test ./... -race

  terraform:
    name: infra validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init (no backend)
        run: terraform init -backend=false -input=false

      - name: validate
        run: terraform validate

      - name: plan (dev, no apply)
        run: |
          terraform plan -input=false -var-file=dev.tfvars -out=tfplan
          terraform show -no-color tfplan > plan.txt
        env:
          # No credentials: the root stack declares only the AWS provider, with the
          # offline-plan flags in main.tf. Google and Snowflake live in their own stacks.
          TF_VAR_enable_cloud_resources: "false"

      # The cloud stacks need real credentials for a plan, so CI validates their
      # configuration only. That still catches a broken reference, a bad type or an
      # unsupported argument before anyone spends money.
      - name: validate the bigquery stack
        working-directory: infra/terraform/bigquery
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: validate the snowflake stack
        working-directory: infra/terraform/snowflake
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/plan.txt
          retention-days: 14

  warehouse:
    name: L3 + L4 warehouse
    runs-on: ubuntu-latest
    needs: [lint-and-unit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start the local stack (object store + warehouse)
        run: |
          cp .env.example .env
          docker compose up -d --wait s3 postgres

      - name: Seed
        run: python -m tools.seed

      - name: Ingest (live sandbox sources)
        run: python -m ingestion.scrapy.sentinel_spiders.run_ingest

      - name: Transform (pandas path — no JDK needed in CI)
        run: python -m transform.spark.local_fallback

      - name: dbt build
        run: python -m tools.tasks.dbt build

      - name: L3 warehouse checks
        run: python -m quality.warehouse.run_warehouse_tests --skip-dbt-test

      - name: L4 expectation suites
        run: python -m quality.expectations.run_suites

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: quality/reports/
          retention-days: 14

  contracts:
    name: L2 spider contracts
    # Live sites: main and the nightly schedule only. A pull request should not wait on
    # someone else's server, and should not be red because that server was slow.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [lint-and-unit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Contracts
        run: python -m quality.contract.run_contracts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-report
          path: quality/reports/contracts.json
          retention-days: 14

  # The new components, each verified by running it rather than by importing it.
  # All of these work without a cloud account: CDC uses local containers, the agent and
  # the control register use the dev warehouse, and the edge worker needs only Node.
  platform-extensions:
    name: CDC + agent + controls + edge
    runs-on: ubuntu-latest
    needs: [lint-and-unit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Postgres, Kafka and Debezium
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres kafka connect

      - name: Seed the operational source table
        run: python -m cdc.seed --mutate

      - name: Register the connector and wait for RUNNING
        run: python -m cdc.register

      - name: Consume the change stream into Iceberg
        run: python -m cdc.consumer --timeout 120 --reset

      - name: Prove batch and stream agree
        run: python -m cdc.parity

      - name: CDC comparator unit tests
        run: pytest cdc/tests -q

      - name: Warehouse parity (parse + transpile, no cloud credentials)
        run: python -m transform.warehouse_parity

      - name: Agent eval (20 answered, 10 refused)
        run: python -m agents.eval

      - name: Agent registry tests
        run: pytest agents/tests -q

      - name: Control register evidence pack
        run: python -m governance.report

      - name: Edge worker typecheck and tests
        working-directory: edge
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-reports
          path: |
            quality/reports/cdc_parity.json
            quality/reports/cdc_consume.json
            quality/reports/agent_eval.json
            quality/reports/agent_trace.jsonl
            quality/reports/controls-report.json
            quality/reports/controls-report.csv
            quality/reports/warehouse_parity.json
          retention-days: 14

  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [lint-and-unit, go-fetcher, terraform, warehouse, platform-extensions]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          echo "lint-and-unit:        ${{ needs.lint-and-unit.result }}"
          echo "go-fetcher:           ${{ needs.go-fetcher.result }}"
          echo "terraform:            ${{ needs.terraform.result }}"
          echo "warehouse:            ${{ needs.warehouse.result }}"
          echo "platform-extensions:  ${{ needs.platform-extensions.result }}"
          if [ "${{ needs.lint-and-unit.result }}" != "success" ] || \
             [ "${{ needs.go-fetcher.result }}" != "success" ] || \
             [ "${{ needs.terraform.result }}" != "success" ] || \
             [ "${{ needs.warehouse.result }}" != "success" ] || \
             [ "${{ needs.platform-extensions.result }}" != "success" ]; then
            echo "::error::quality gate failed"
            exit 1
          fi
          echo "quality gate passed"
