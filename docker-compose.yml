# SENTINEL — local stack. No cloud spend.
#
# Object storage note: MinIO withdrew its public Docker images in 2026, so the local
# S3 endpoint is adobe/s3mock — a real S3 API implementation used for SDK testing.
# The application code only knows S3_ENDPOINT + credentials, so pointing it at real
# AWS S3 or a MinIO cluster is a config change, not a code change. See
# docs/adr/0004-local-object-store.md.
#
# Airflow, Spark and the Go fetcher join in later milestones.
name: ${COMPOSE_PROJECT_NAME:-sentinel}

services:
  s3:
    image: adobe/s3mock:5.2.3
    # No bind mount: s3mock runs as a non-root buildpack user, and a root-owned named
    # volume makes its store unreadable (ListBuckets -> InternalError). The local mock
    # is not a system of record, so it keeps state in the container layer.
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET_RAW:-sentinel-raw},${S3_BUCKET_BRONZE:-sentinel-bronze},${S3_BUCKET_SILVER:-sentinel-silver}
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: ${S3_REGION:-us-east-1}
    ports:
      - "9090:9090"   # S3 API (HTTP)
      - "9191:9191"   # S3 API (HTTPS)
    healthcheck:
      # The S3 API answers a service list at the root with an XML body.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/ | grep -q ListAllMyBucketsResult || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  go-fetcher:
    build:
      context: ./ingestion/go-fetcher
    environment:
      PORT: "8088"
      FINGERPRINT_PROFILE: ${FINGERPRINT_PROFILE:-chrome}
      FINGERPRINT_PLATFORM: ${FINGERPRINT_PLATFORM:-windows}
      RATE_PER_SECOND: ${FETCHER_RATE_PER_SECOND:-5}
      RATE_BURST: "10"
      MAX_CONCURRENCY: ${FETCHER_MAX_CONCURRENCY:-16}
      REQUEST_TIMEOUT_MS: "20000"
      # Production reads this from governance/sources.yml.
      FETCH_ALLOWED_HOSTS: ${FETCH_ALLOWED_HOSTS:-books.toscrape.com,quotes.toscrape.com,scrapethissite.com}
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8088/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-init:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-change-me-postgres}@postgres:5432/${POSTGRES_DB:-sentinel}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-sentinel-local-only}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
      SENTINEL_ROOT: /opt/sentinel
      PYTHONPATH: /opt/sentinel
      SENTINEL_LOG_JSON: "1"
      S3_ENDPOINT_URL: http://s3:9090
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sentinel}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-sentinel}
      S3_BUCKET_RAW: ${S3_BUCKET_RAW:-sentinel-raw}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      CLICKHOUSE_HOST: clickhouse
      GO_FETCHER_URL: http://go-fetcher:8088
      DBT_TARGET: ${DBT_TARGET:-dev}
      DUCKDB_PATH: /opt/sentinel/data/warehouse/sentinel.duckdb
    volumes:
      - ./orchestration/dags:/opt/airflow/dags:ro
      - ./data:/opt/sentinel/data
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username ${AIRFLOW_ADMIN_USER:-admin}
                 --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
                 --firstname Sentinel --lastname Admin --role Admin
                 --email admin@sentinel.local || true"
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes:
      - ./orchestration/dags:/opt/airflow/dags:ro
      - ./data:/opt/sentinel/data
    ports:
      - "8080:8080"
    command: airflow webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes:
      - ./orchestration/dags:/opt/airflow/dags:ro
      - ./data:/opt/sentinel/data
    command: airflow scheduler
    restart: unless-stopped

  postgres:
    image: postgres:17.4-alpine
    # wal_level=logical is what makes CDC possible at all: the default `replica` level
    # writes only enough WAL to replay whole pages, so logical decoding has nothing to
    # read. Debezium reports this as "logical decoding requires wal_level >= logical".
    # See docs/adr/0011-cdc-reads-the-write-ahead-log.md.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
    ports:
      # Host port 5433, not 5432: many developer machines already run a native Postgres
      # on 5432, and it listens on ::1 while Docker publishes on IPv4. "localhost" then
      # resolves to the native server and auth fails confusingly. See ADR 0005.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./tools/seed/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # --- CDC path -------------------------------------------------------------
  # Kafka runs in KRaft mode: no ZooKeeper container, one less process to keep
  # healthy on a laptop. The cluster id is fixed so a restarted volume does not
  # refuse to rejoin its own metadata log.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners, because the broker advertises a different address to each
      # client and the client connects to whatever it is told. A single advertised
      # address of kafka:9092 works inside compose and fails on the host with
      # "Failed to resolve 'kafka:9092'" — the host resolves the name, not the port
      # mapping. Publishing 9094 and advertising localhost:9094 for EXTERNAL is the
      # fix, and it is a config change, not a second cluster.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # 512 MB is enough for a single-partition demo topic and leaves room for the
      # rest of the stack on an 8 GB machine.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "9094:9094"   # EXTERNAL listener, for the Python consumer on the host
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # Debezium reads the Postgres WAL and publishes row-level changes. Pinned to a
  # specific release: connector behaviour and the JSON envelope shape differ between
  # minor versions, and the consumer parses that envelope.
  connect:
    image: debezium/connect:2.7.3.Final
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: sentinel-connect
      CONFIG_STORAGE_TOPIC: sentinel_connect_configs
      OFFSET_STORAGE_TOPIC: sentinel_connect_offsets
      STATUS_STORAGE_TOPIC: sentinel_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Schemas are disabled on purpose: the envelope is then plain JSON, which the
      # consumer can read without a schema registry. A registry is the right answer
      # for many producers; for one producer it is another service to run.
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "8083:8083"   # Connect REST API (connector registration)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/connectors >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.4-alpine
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-sentinel}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me-clickhouse}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP
      - "9002:9000"   # native
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./analytics/clickhouse/ddl:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost resolves to ::1 first
      # and ClickHouse listens on IPv4.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  metabase:
    image: metabase/metabase:v0.55.5
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: ${POSTGRES_USER:-sentinel}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-change-me-postgres}
      MB_SITE_NAME: SENTINEL
      MB_ANON_TRACKING_ENABLED: "false"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
  clickhouse-data:
