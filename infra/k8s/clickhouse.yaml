# ClickHouse — the analytical serving layer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:25.4-alpine
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: native
          env:
            - name: CLICKHOUSE_DB
              valueFrom:
                configMapKeyRef: { name: sentinel-config, key: CLICKHOUSE_DB }
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: { name: sentinel-secrets, key: CLICKHOUSE_PASSWORD }
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: sentinel
spec:
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      nodePort: 30812
    - name: native
      port: 9000
      targetPort: 9000
  type: NodePort